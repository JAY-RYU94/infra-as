parameters:
  - name: sonarQubeServiceConnection
    type: string
  - name: sonarProjectKey
    type: string
  - name: sourceDirectory
    type: string
    default: "."

steps:
  - checkout: self
    fetchDepth: 0

  - task: SonarQubePrepare@8
    displayName: Prepare SonarQube analysis
    inputs:
      SonarQube: ${{ parameters.sonarQubeServiceConnection }}
      scannerMode: cli
      configMode: manual
      cliProjectKey: ${{ parameters.sonarProjectKey }}
      cliSources: ${{ parameters.sourceDirectory }}
      cliScannerVersion: 8.1.0.6389
      extraProperties: |
        sonar.python.coverage.reportPaths=coverage.xml
        sonar.python.xunit.reportPath=test-results.xml

  - script: |
      uv python install
      uv sync --frozen --all-groups
      uv run pytest --junitxml=test-results.xml --cov --cov-report=xml:coverage.xml
    displayName: Test with project-selected Python

  - task: SonarQubeAnalyze@8
    displayName: Analyze

  - task: SonarQubePublish@8
    displayName: Publish quality gate
    inputs:
      pollingTimeoutSec: "300"
